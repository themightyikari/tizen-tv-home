<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<style>
  /* ---- THEME ---- */
  :root{
    --text:#ffffff; --muted:#e7f1ff;
    --xp-blue:#2a6fdb; --focus:#bcd8ff;
    --radius:20px; --safe-x:5vw; --safe-y:4.5vh;
    --panel:rgba(8,20,42,.52);
    --panel-focus:rgba(14,32,66,.86);
    --panel-border:rgba(255,255,255,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); overflow:hidden; background:#4f93d6;
  }

  /* ---- Windows XP "Bliss"-style scene (CSS/SVG homage, drawn from scratch) ---- */
  #scene{position:fixed; inset:0; z-index:-2;}
  #scene svg{width:100%; height:100%; display:block;}
  /* soft scrim so white text stays readable over the bright scene */
  #scrim{position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(120vw 70vh at 50% 18%, rgba(0,0,0,0) 40%, rgba(2,14,32,.18) 100%),
      linear-gradient(to bottom, rgba(2,16,36,.26) 0%, rgba(2,16,36,.02) 26%,
                      rgba(0,12,28,.10) 62%, rgba(0,8,22,.48) 100%);
  }

  .wrap{height:100%; padding:var(--safe-y) var(--safe-x); display:flex; flex-direction:column;}

  /* ---- top bar ---- */
  header{display:flex; justify-content:space-between; align-items:flex-start;}
  .greeting{font-size:2.5vw; font-weight:700; letter-spacing:.3px;
    text-shadow:0 2px 10px rgba(0,30,70,.5), 0 1px 2px rgba(0,0,0,.35);}
  .greeting small{display:block; color:var(--muted); font-size:1.2vw; font-weight:500; margin-top:.4vh;
    text-shadow:0 1px 6px rgba(0,25,60,.5);}
  .weather{text-align:right; min-width:14vw;
    text-shadow:0 2px 10px rgba(0,30,70,.5), 0 1px 2px rgba(0,0,0,.35);}
  .weather .w-main{display:flex; align-items:center; justify-content:flex-end; gap:.6vw;}
  .weather .w-ico{font-size:2.8vw; line-height:1;}
  .weather .w-temp{font-size:2.6vw; font-weight:700;}
  .weather .w-sub{font-size:1.2vw; color:var(--muted); margin-top:.2vh; font-weight:500;}

  /* ---- clock ---- */
  .clockwrap{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;}
  .clock{font-size:14vw; font-weight:700; line-height:.95; letter-spacing:-.4vw;
         text-shadow:0 4px 24px rgba(0,30,70,.55), 0 2px 4px rgba(0,0,0,.35);}
  .clock .sec{font-size:3.6vw; color:var(--muted); vertical-align:top; margin-left:.4vw; letter-spacing:0;}
  .date{font-size:2vw; color:var(--muted); margin-top:.8vh; letter-spacing:1px; font-weight:600;
    text-shadow:0 2px 10px rgba(0,25,60,.55);}

  /* ---- tiles ---- */
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:1.6vw; margin-top:2.6vh;}
  .tile{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:2.1vh 1vw; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1vh; cursor:pointer; outline:none;
    box-shadow:0 8px 26px rgba(0,0,0,.22);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .tile .emoji{font-size:3.2vw; line-height:1; filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
  .tile .label{font-size:1.3vw; font-weight:600; color:var(--muted);}
  .tile.unavailable{opacity:.4;}

  /* ---- bottom nav row ---- */
  .nav{display:flex; justify-content:center; gap:1.6vw; margin-top:1.8vh;}
  .navbtn{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:999px;
    padding:1.3vh 2.4vw; display:flex; align-items:center; gap:.7vw; cursor:pointer; outline:none;
    box-shadow:0 8px 26px rgba(0,0,0,.22);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .navbtn .emoji{font-size:1.7vw; line-height:1;}
  .navbtn .label{font-size:1.25vw; font-weight:600; color:var(--muted);}

  /* ---- shared focus state ---- */
  .tile.focused, .navbtn.focused{
    transform:scale(1.08); background:var(--panel-focus); border-color:var(--focus);
    box-shadow:0 0 0 4px rgba(90,150,255,.5), 0 18px 48px rgba(0,0,0,.45);
  }
  .tile.focused .label, .navbtn.focused .label{color:var(--text);}

  /* ---- toast ---- */
  #toast{
    position:fixed; left:50%; bottom:9vh; transform:translateX(-50%) translateY(20px);
    background:rgba(6,16,34,.95); border:1px solid var(--panel-border); color:var(--text);
    padding:1.4vh 2vw; border-radius:16px; font-size:1.4vw; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- Windows XP "Bliss"-style background: a hand-built CSS/SVG homage (no copyrighted photo). -->
<div id="scene">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#2e74c4"/>
        <stop offset="42%" stop-color="#4f93d6"/>
        <stop offset="74%" stop-color="#9fc9ec"/>
        <stop offset="100%" stop-color="#e9f4fc"/>
      </linearGradient>
      <linearGradient id="hill" x1="0" y1="0" x2="0.15" y2="1">
        <stop offset="0%"  stop-color="#9fd14a"/>
        <stop offset="30%" stop-color="#7cb23a"/>
        <stop offset="70%" stop-color="#5f8f2b"/>
        <stop offset="100%" stop-color="#4a7322"/>
      </linearGradient>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
    </defs>

    <!-- sky -->
    <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
    <!-- subtle sun glow upper-left, like the original -->
    <ellipse cx="430" cy="210" rx="520" ry="360" fill="url(#sun)"/>

    <!-- clouds -->
    <g fill="#ffffff" filter="url(#soft)">
      <g opacity="0.92">
        <ellipse cx="300" cy="200" rx="150" ry="42"/>
        <ellipse cx="400" cy="178" rx="120" ry="48"/>
        <ellipse cx="220" cy="225" rx="110" ry="36"/>
      </g>
      <g opacity="0.85">
        <ellipse cx="1180" cy="150" rx="170" ry="40"/>
        <ellipse cx="1290" cy="135" rx="120" ry="46"/>
        <ellipse cx="1080" cy="170" rx="110" ry="34"/>
      </g>
      <g opacity="0.7">
        <ellipse cx="760" cy="120" rx="140" ry="30"/>
        <ellipse cx="850" cy="108" rx="95" ry="34"/>
      </g>
      <g opacity="0.6">
        <ellipse cx="1480" cy="300" rx="150" ry="34"/>
      </g>
    </g>

    <!-- rolling green hill -->
    <path d="M0,585 C 280,478 520,452 770,505 C 1020,558 1270,636 1600,598 L 1600,900 L 0,900 Z"
          fill="url(#hill)"/>
    <!-- sunlit crest highlight -->
    <path d="M0,585 C 280,478 520,452 770,505 C 1020,558 1270,636 1600,598"
          fill="none" stroke="#c7ec6e" stroke-width="7" opacity="0.55"/>
  </svg>
</div>
<div id="scrim"></div>

<div class="wrap">
  <header>
    <div class="greeting" id="greeting">Hello<small id="hello-sub">Welcome home</small></div>
    <div class="weather" id="weather"><div class="w-sub">&nbsp;</div></div>
  </header>

  <div class="clockwrap">
    <div class="clock"><span id="hhmm">--:--</span><span class="sec" id="sec">00</span></div>
    <div class="date" id="date">&nbsp;</div>
  </div>

  <div class="tiles" id="tiles"></div>
  <div class="nav" id="nav"></div>
</div>

<div id="toast"></div>

<script>
/* ================== CONFIG (edit me) ================== */
const CONFIG = {
  name: "",                 // put your name for a personal greeting, e.g. "Alex"
  clock24h: false,          // true = 24-hour clock
  timeZone: "America/New_York",   // East Coast; auto-handles EST/EDT
  weather: {
    city: "Summerville",    // display label
    lat: 33.02, lon: -80.18, // Summerville, SC
    unit: "fahrenheit"      // "fahrenheit" or "celsius"
  },
  // Exact app IDs read and verified from THIS TV's installed-app list.
  tiles: [
    { label:"Disney+",     emoji:"🏰", app:"MCmYXNxgcu.DisneyPlus" },
    { label:"Netflix",     emoji:"🔴", app:"org.tizen.netflix-app" },
    { label:"Peacock",     emoji:"🦚", app:"gzcc4LRFBF.Peacock" },
    { label:"Max",         emoji:"🎬", app:"5b8c3eb16b.BeamCTVDev" },
    { label:"Paramount+",  emoji:"⛰️", app:"rJyOSqC6Up.CBSAllAccess" },
    { label:"Prime Video", emoji:"📦", app:"org.tizen.primevideo" },
    { label:"Hulu",        emoji:"🟢", app:"LBUAQX1exg.Hulu" },
  ],
  columns: 3,
  // bottom nav buttons
  nav: [
    { label:"TV Home",   emoji:"🏠", action:"home" },
    { label:"TizenBrew", emoji:"🧩", action:"tizenbrew" },
  ],
  tizenbrewApp: "xvvl3S1bvH.TizenBrewStandalone"
};
/* ===================================================== */

const pad = n => String(n).padStart(2,"0");

// Get the current time in CONFIG.timeZone, resilient on old webviews.
function nowParts(){
  try{
    const f = new Intl.DateTimeFormat("en-US",{
      timeZone: CONFIG.timeZone, hour12:false,
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      weekday:"long", month:"long", day:"numeric"
    });
    const o = {}; f.formatToParts(new Date()).forEach(p => o[p.type] = p.value);
    let h = parseInt(o.hour,10); if(h === 24) h = 0;      // some engines emit "24"
    return { h, m:o.minute, s:o.second, weekday:o.weekday, month:o.month, day:o.day };
  }catch(e){
    const d = new Date();
    return { h:d.getHours(), m:pad(d.getMinutes()), s:pad(d.getSeconds()),
      weekday:d.toLocaleDateString(undefined,{weekday:"long"}),
      month:d.toLocaleDateString(undefined,{month:"long"}), day:String(d.getDate()) };
  }
}

function tickClock(){
  const t = nowParts();
  let h = t.h;
  if(!CONFIG.clock24h){ h = h % 12 || 12; }
  document.getElementById("hhmm").textContent = (CONFIG.clock24h ? pad(h) : h) + ":" + t.m;
  document.getElementById("sec").textContent = t.s;
  document.getElementById("date").textContent = t.weekday + ", " + t.month + " " + t.day;
  const part = t.h < 12 ? "Good morning" : t.h < 18 ? "Good afternoon" : "Good evening";
  document.getElementById("greeting").childNodes[0].nodeValue =
    CONFIG.name ? part + ", " + CONFIG.name : part;
}
setInterval(tickClock, 1000); tickClock();

/* ---- weather (Open-Meteo, no API key) ---- */
const WICON = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",
  61:"🌦️",63:"🌧️",65:"🌧️",66:"🌧️",67:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",77:"🌨️",
  80:"🌦️",81:"🌧️",82:"⛈️",85:"🌨️",86:"❄️",95:"⛈️",96:"⛈️",99:"⛈️"};
const WTEXT = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",
  51:"Drizzle",53:"Drizzle",55:"Drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",
  66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow",
  80:"Showers",81:"Showers",82:"Storms",85:"Snow showers",86:"Snow",95:"Thunderstorm",
  96:"Thunderstorm",99:"Thunderstorm"};
async function loadWeather(){
  const w = CONFIG.weather;
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}`
            + `&current=temperature_2m,weather_code&temperature_unit=${w.unit}`
            + `&timezone=${encodeURIComponent(CONFIG.timeZone)}`;
    const r = await fetch(u); const d = await r.json();
    const t = Math.round(d.current.temperature_2m);
    const code = d.current.weather_code;
    const ico = WICON[code] || "🌡️";
    const cond = WTEXT[code] || "";
    document.getElementById("weather").innerHTML =
      `<div class="w-main"><span class="w-ico">${ico}</span><span class="w-temp">${t}°</span></div>`
    + `<div class="w-sub">${cond ? cond + " · " : ""}${w.city}</div>`;
  }catch(e){
    document.getElementById("weather").innerHTML = `<div class="w-sub">${w.city}</div>`;
  }
}
loadWeather(); setInterval(loadWeather, 15*60*1000);

/* ================== launcher / remote nav ================== */
// On the TV, the module page has NO window.tizen (served over localhost). Native
// launching + "go home" go through service.js, a tiny Node service TizenBrew runs
// WITH tizen access, exposed on localhost. A direct-tizen path is kept as a fallback
// and the browser preview just shows a friendly toast.
const SERVICE   = "http://127.0.0.1:8099";
const HAS_TIZEN = typeof window.tizen !== "undefined" && !!window.tizen.application;

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}

function launchViaService(appId, label, triesLeft = 6){
  fetch(SERVICE + "/api/launch", {
    method:"POST", headers:{ "Content-Type":"text/plain" }, // simple request -> no CORS preflight
    body: JSON.stringify({ id: appId })
  })
  .then(r => r.json())
  .then(d => {
    if(d && d.ok) toast("Opening " + label + "…");
    else toast("Couldn't launch " + label + (d && d.error ? " (" + d.error + ")" : ""));
  })
  .catch(() => {
    if(triesLeft > 0) setTimeout(() => launchViaService(appId, label, triesLeft - 1), 400);
    else toast(label + ": launcher service not reachable (works on the TV)");
  });
}
function launchNative(appId, label){
  if(HAS_TIZEN){
    try{
      window.tizen.application.launch(appId,
        ()=>toast("Opening " + label + "…"),
        e=>toast("Couldn't launch " + label + " (" + e.name + ")"));
    }catch(err){ toast("Launch error: " + err.message); }
    return;
  }
  launchViaService(appId, label);
}
function goHome(){
  if(HAS_TIZEN){
    try{ window.tizen.application.getCurrentApplication().exit(); return; }
    catch(err){ /* fall through to service */ }
  }
  toast("Returning to TV home…");
  fetch(SERVICE + "/api/home", { method:"POST", headers:{ "Content-Type":"text/plain" }, body:"{}" })
    .catch(() => toast("Home: launcher service not reachable (works on the TV)"));
}

/* ---- build tiles + nav, then wire D-pad navigation ---- */
const tilesEl = document.getElementById("tiles");
const navEl   = document.getElementById("nav");
const COLS    = CONFIG.columns;
let rows = [];            // rows of focusable elements for D-pad
let cur  = { r:0, c:0 };

function activateEl(el){
  const ty = el.dataset.type;
  if(ty === "app")        launchNative(el.dataset.app, el.dataset.label);
  else if(ty === "home")  goHome();
  else if(ty === "tizenbrew") launchNative(CONFIG.tizenbrewApp, "TizenBrew");
}

function build(){
  // tiles
  tilesEl.innerHTML = "";
  CONFIG.tiles.forEach(t => {
    const el = document.createElement("div");
    el.className = "tile" + (t.installed === false ? " unavailable" : "");
    el.tabIndex = 0;
    el.dataset.type = "app"; el.dataset.app = t.app; el.dataset.label = t.label;
    el.innerHTML = `<div class="emoji">${t.emoji}</div><div class="label">${t.label}</div>`;
    el.addEventListener("click", ()=>{ focusEl(el); activateEl(el); });
    tilesEl.appendChild(el);
  });
  // nav
  navEl.innerHTML = "";
  CONFIG.nav.forEach(n => {
    const el = document.createElement("div");
    el.className = "navbtn"; el.tabIndex = 0;
    el.dataset.type = n.action;
    el.innerHTML = `<span class="emoji">${n.emoji}</span><span class="label">${n.label}</span>`;
    el.addEventListener("click", ()=>{ focusEl(el); activateEl(el); });
    navEl.appendChild(el);
  });

  // assemble rows: tile rows (COLS wide) + one nav row
  rows = [];
  const tiles = [...tilesEl.children];
  let row = [];
  tiles.forEach(el => { row.push(el); if(row.length === COLS){ rows.push(row); row = []; } });
  if(row.length) rows.push(row);
  rows.push([...navEl.children]);

  cur = { r:0, c:0 };
  focusCur();
}

function allEls(){ return rows.reduce((a,r)=>a.concat(r), []); }
function focusCur(){
  allEls().forEach(e => e.classList.remove("focused"));
  const row = rows[cur.r]; if(!row) return;
  if(cur.c >= row.length) cur.c = row.length - 1;
  const el = row[cur.c];
  if(el){ el.classList.add("focused"); el.focus(); }
}
function focusEl(el){
  rows.forEach((r,ri)=>{ const ci = r.indexOf(el); if(ci !== -1){ cur = { r:ri, c:ci }; } });
  focusCur();
}
function move(dir){
  const row = rows[cur.r]; if(!row) return;
  if(dir === "left")  cur.c = (cur.c - 1 + row.length) % row.length;
  if(dir === "right") cur.c = (cur.c + 1) % row.length;
  if(dir === "up")    cur.r = Math.max(0, cur.r - 1);
  if(dir === "down")  cur.r = Math.min(rows.length - 1, cur.r + 1);
  focusCur();
}

document.addEventListener("keydown", e=>{
  switch(e.keyCode){
    case 37: move("left");  e.preventDefault(); break;
    case 39: move("right"); e.preventDefault(); break;
    case 38: move("up");    e.preventDefault(); break;
    case 40: move("down");  e.preventDefault(); break;
    case 13: { const el = rows[cur.r] && rows[cur.r][cur.c]; if(el) activateEl(el); e.preventDefault(); break; } // OK
    case 10009: e.preventDefault(); break; // swallow Tizen BACK so it doesn't drop the launcher
  }
});

build();
</script>
</body>
</html>

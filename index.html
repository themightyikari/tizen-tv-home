<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<style>
  /* ============ AQUARIUM THEME v2 (real art, living water) ============ */
  :root{
    --text:#eafcff; --muted:#bfeaf7;
    --focus:#8ff0ff; --radius:22px;
    --safe-x:4vw; --safe-y:4vh;
    --w-top:#1a84b8; --w-mid:#0c5680; --w-deep:#072f49; --w-abyss:#03192b;
    --panel:rgba(6,30,48,.46);
    --panel-focus:rgba(10,46,72,.82);
    --panel-border:rgba(150,230,255,.42);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); overflow:hidden;
    background:linear-gradient(to bottom, var(--w-top) 0%, var(--w-mid) 34%, var(--w-deep) 68%, var(--w-abyss) 100%);
  }

  /* ---- painted reef background (artist PNG, caustics toned down for live layer) ---- */
  #bg{position:fixed; inset:0; z-index:-8;
    background:#072f49 url(reef_background.png) center center / cover no-repeat;}

  /* ---- drifting volumetric god-rays (artist overlay, slow lateral pan) ---- */
  #godrays{position:fixed; top:0; left:50%; width:133.34vw; height:100vh; margin-left:-66.67vw;
    background:url(godrays_overlay.png) center center / 100% 100% no-repeat;
    opacity:.11; z-index:-7; pointer-events:none; will-change:transform;
    animation:grPan 46s ease-in-out infinite alternate;}
  @keyframes grPan{from{transform:translate3d(-150px,0,0);} to{transform:translate3d(150px,0,0);}}

  /* ---- living caustics: two seamless tiling layers, concentrated low on the sand,
         softly faded toward the top (no hard edge), no blend mode (perf) ---- */
  #caustics{position:fixed; left:0; right:0; top:62vh; bottom:0; z-index:-6;
    pointer-events:none; overflow:hidden;
    -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 14%, rgba(0,0,0,0) 46%);
            mask-image:linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 14%, rgba(0,0,0,0) 46%);}
  #caustics .c{position:absolute; top:0; left:0;
    width:calc(100% + 1024px); height:calc(100% + 1024px);
    background-repeat:repeat; will-change:transform;}
  #caustics .c.a{background-image:url(caustics_tile.png); background-size:1024px 1024px;
    opacity:.42; animation:cpanA 62s linear infinite;}
  #caustics .c.b{background-image:url(caustics_tile.png); background-size:1403px 1403px;
    opacity:.20; animation:cpanB 94s linear infinite;}
  @keyframes cpanA{from{transform:translate3d(0,0,0);} to{transform:translate3d(-1024px,-1024px,0);}}
  @keyframes cpanB{from{transform:translate3d(0,0,0);} to{transform:translate3d(-1403px,-1403px,0);}}

  /* ---- back plants (kelp, swaying), in front of water, behind fish ---- */
  #kelp{position:fixed; inset:0; z-index:-5; pointer-events:none; overflow:hidden;}
  #kelp img{position:absolute; width:auto; transform-origin:50% 100%; will-change:transform;}
  @keyframes sway1{0%,100%{transform:rotate(-2deg);} 50%{transform:rotate(2deg);}}
  @keyframes sway2{0%,100%{transform:rotate(1.6deg);} 50%{transform:rotate(-2.6deg);}}
  @keyframes sway3{0%,100%{transform:rotate(-1.4deg);} 50%{transform:rotate(2.6deg);}}

  /* ---- living layer (fish, turtle, crab, jellyfish, bubbles) ---- */
  /* explicit full-viewport size: the canvas is a replaced element, so its low-res
     buffer must be STRETCHED to the screen via CSS (inset:0 alone would display it
     at buffer size = 62% of the screen, clipping fish mid-screen) */
  #life{position:fixed; top:0; left:0; width:100%; height:100%; z-index:-3; pointer-events:none;}

  /* #life is now a <canvas>; fish/jellies/bubbles are drawn on it by the JS engine. */
  /* sprite plumbing kept for the DOM plant layer (animated anemone + bubble columns) */
  .fit{display:block; transform-origin:center;}
  .sprite{position:relative; overflow:hidden;}
  .sprite > *{position:absolute; top:0; left:0;}

  /* ---- foreground plants (coral + a living anemone), in front of fish ---- */
  #front{position:fixed; inset:0; z-index:-2; pointer-events:none; overflow:hidden;}
  #front img.coral{position:absolute; width:auto;}
  .anem{position:absolute;}
  .anem .fit{transform-origin:50% 100%;}

  /* ---- readability scrim (keeps white clock crisp) ---- */
  #scrim{position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(120vw 58vh at 50% 40%, rgba(0,0,0,0) 48%, rgba(2,18,34,.24) 100%),
      linear-gradient(to bottom, rgba(2,20,36,.30) 0%, rgba(2,20,36,0) 24%, rgba(0,14,26,.32) 100%);}

  /* ---- layout ---- */
  .wrap{height:100%; padding:var(--safe-y) var(--safe-x); display:flex; flex-direction:column;}
  header{display:flex; justify-content:space-between; align-items:flex-start;}
  .greeting{font-size:2.4vw; font-weight:700; letter-spacing:.3px;
    text-shadow:0 2px 16px rgba(0,30,55,.8);}
  .greeting small{display:block; color:var(--muted); font-size:1.15vw; font-weight:500; margin-top:.4vh;}
  .weather{text-align:right; min-width:14vw; text-shadow:0 2px 16px rgba(0,30,55,.8);}
  .weather .w-main{display:flex; align-items:center; justify-content:flex-end; gap:.6vw;}
  .weather .w-ico{font-size:2.6vw;} .weather .w-temp{font-size:2.5vw; font-weight:700;}
  .weather .w-sub{font-size:1.15vw; color:var(--muted); margin-top:.2vh; font-weight:500;}

  .clockwrap{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;}
  .clock{font-size:13vw; font-weight:700; line-height:.95; letter-spacing:-.4vw;
    text-shadow:0 0 54px rgba(120,230,255,.5), 0 4px 24px rgba(0,25,55,.75);}
  .clock .sec{font-size:3.4vw; color:var(--muted); vertical-align:top; margin-left:.4vw; letter-spacing:0;}
  .date{font-size:1.9vw; color:var(--muted); margin-top:.6vh; letter-spacing:1px; font-weight:600;
    text-shadow:0 2px 14px rgba(0,25,55,.75);}

  /* ---- app portholes (artist brass-glass rings) ---- */
  .portholes{display:flex; justify-content:center; gap:1.3vw; margin-top:1.4vh; flex-wrap:nowrap;}
  .port{width:10vw; display:flex; flex-direction:column; align-items:center; gap:.7vh; cursor:pointer; outline:none;}
  .port .glass{
    position:relative; width:10vw; height:10vw;
    display:flex; align-items:center; justify-content:center;
    transition:transform .16s ease, filter .16s ease;
  }
  .port .glass::before, .port .glass::after{
    content:""; position:absolute; inset:0;
    background:center/contain no-repeat; transition:opacity .18s ease;}
  .port .glass::before{background-image:url(porthole_ring.png); opacity:1;}
  .port .glass::after {background-image:url(porthole_ring_focus.png); opacity:0;}
  .port .emoji{position:relative; z-index:1; font-size:4.1vw; line-height:1;
    filter:drop-shadow(0 3px 7px rgba(0,0,0,.5));}
  .port .iconimg{position:relative; z-index:1; width:6.2vw; height:6.2vw; object-fit:contain;
    filter:drop-shadow(0 3px 7px rgba(0,0,0,.55));}
  .port .label{font-size:1.1vw; font-weight:600; color:var(--muted);
    text-shadow:0 2px 10px rgba(0,22,45,.8);}
  .port.unavailable{opacity:.4;}

  /* ---- bottom nav pills ---- */
  .nav{display:flex; justify-content:center; gap:1.4vw; margin-top:1.4vh;}
  .navbtn{display:flex; align-items:center; gap:.6vw; cursor:pointer; outline:none;
    padding:1.05vh 2.1vw; border-radius:999px; background:var(--panel);
    border:2px solid var(--panel-border); box-shadow:0 8px 22px rgba(0,0,0,.3);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;}
  .navbtn .emoji{font-size:1.6vw;} .navbtn .naviconimg{width:2.1vw; height:2.1vw; object-fit:contain; vertical-align:middle;}
  .navbtn .label{font-size:1.15vw; font-weight:600; color:var(--muted);}

  /* ---- focus states ---- */
  .port.focused .glass{transform:scale(1.12); filter:drop-shadow(0 0 16px var(--accent, rgba(120,235,255,.85)));}
  .port.focused .glass::after{opacity:1;}
  .port.focused .glass::before{opacity:0;}
  .port.focused .label{color:var(--text);}
  .navbtn.focused{
    transform:scale(1.1); border-color:var(--focus);
    background:var(--panel-focus);
    box-shadow:0 0 0 4px rgba(120,235,255,.4), 0 0 40px rgba(120,235,255,.7);}
  .navbtn.focused .label{color:var(--text);}

  /* ---- toast ---- */
  #toast{position:fixed; left:50%; bottom:3vh; transform:translateX(-50%) translateY(20px);
    background:rgba(4,22,38,.95); border:1px solid var(--panel-border); color:var(--text);
    padding:1.3vh 2vw; border-radius:16px; font-size:1.3vw; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; box-shadow:0 12px 40px rgba(0,0,0,.5); z-index:5;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ===== Aquarium scene: the ENTIRE scene (background, god-rays, caustics, plants, creatures, scrim) is drawn on this ONE canvas by the engine; only the UI below stays DOM on top ===== -->
<canvas id="life"></canvas>

<div class="wrap">
  <header>
    <div class="greeting" id="greeting">Hello<small id="hello-sub">Welcome home</small></div>
    <div class="weather" id="weather"><div class="w-sub">&nbsp;</div></div>
  </header>

  <div class="clockwrap">
    <div class="clock"><span id="hhmm">--:--</span><span class="sec" id="sec">00</span></div>
    <div class="date" id="date">&nbsp;</div>
  </div>

  <div class="portholes" id="portholes"></div>
  <div class="nav" id="nav"></div>
</div>

<div id="toast"></div>

<!-- ambient background music (loops) -->
<audio id="bgm" src="aquarium_loop.mp3" loop preload="auto"></audio>

<script>
/* ================== CONFIG ================== */
const CONFIG = {
  name: "",
  clock24h: false,
  timeZone: "America/New_York",
  weather: { city:"Summerville", lat:33.02, lon:-80.18, unit:"fahrenheit" },
  tiles: [
    { label:"Disney+",     emoji:"🏰", icon:"icon_disney.png",    app:"MCmYXNxgcu.DisneyPlus",   accent:"rgba(60,130,255,.85)" },
    { label:"Netflix",     emoji:"🔴", icon:"icon_netflix.png",   app:"org.tizen.netflix-app",   accent:"rgba(229,9,20,.85)" },
    { label:"Peacock",     emoji:"🦚", icon:"icon_peacock.png",   app:"gzcc4LRFBF.Peacock",      accent:"rgba(245,166,35,.85)" },
    { label:"Max",         emoji:"🎬", icon:"icon_max.png",       app:"5b8c3eb16b.BeamCTVDev",   accent:"rgba(123,97,255,.85)" },
    { label:"Paramount+",  emoji:"⛰️", icon:"icon_paramount.png", app:"rJyOSqC6Up.CBSAllAccess", accent:"rgba(0,100,255,.85)" },
    { label:"Prime Video", emoji:"📦", icon:"icon_prime.png",     app:"org.tizen.primevideo",    accent:"rgba(0,168,225,.85)" },
    { label:"Hulu",        emoji:"🟢", icon:"icon_hulu.png",      app:"LBUAQX1exg.Hulu",         accent:"rgba(28,231,131,.85)" },
  ],
  nav: [
    { label:"TV Home",   emoji:"🏠", icon:"icon_home.png",      action:"home" },
    { label:"TizenBrew", emoji:"🧩", icon:"icon_tizenbrew.png", action:"tizenbrew" },
  ],
  tizenbrewApp: "xvvl3S1bvH.TizenBrewStandalone"
};
/* ============================================ */

const pad = n => String(n).padStart(2,"0");
function nowParts(){
  try{
    const f = new Intl.DateTimeFormat("en-US",{ timeZone:CONFIG.timeZone, hour12:false,
      hour:"2-digit", minute:"2-digit", second:"2-digit", weekday:"long", month:"long", day:"numeric" });
    const o={}; f.formatToParts(new Date()).forEach(p=>o[p.type]=p.value);
    let h=parseInt(o.hour,10); if(h===24) h=0;
    return { h, m:o.minute, s:o.second, weekday:o.weekday, month:o.month, day:o.day };
  }catch(e){
    const d=new Date();
    return { h:d.getHours(), m:pad(d.getMinutes()), s:pad(d.getSeconds()),
      weekday:d.toLocaleDateString(undefined,{weekday:"long"}),
      month:d.toLocaleDateString(undefined,{month:"long"}), day:String(d.getDate()) };
  }
}
function tickClock(){
  const t=nowParts(); let h=t.h; if(!CONFIG.clock24h){ h=h%12||12; }
  document.getElementById("hhmm").textContent=(CONFIG.clock24h?pad(h):h)+":"+t.m;
  document.getElementById("sec").textContent=t.s;
  document.getElementById("date").textContent=t.weekday+", "+t.month+" "+t.day;
  const part=t.h<12?"Good morning":t.h<18?"Good afternoon":"Good evening";
  document.getElementById("greeting").childNodes[0].nodeValue=CONFIG.name?part+", "+CONFIG.name:part;
}
setInterval(tickClock,1000); tickClock();

/* ---- weather ---- */
const WICON={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌦️",63:"🌧️",65:"🌧️",
  66:"🌧️",67:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",77:"🌨️",80:"🌦️",81:"🌧️",82:"⛈️",85:"🌨️",86:"❄️",95:"⛈️",96:"⛈️",99:"⛈️"};
const WTEXT={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",51:"Drizzle",53:"Drizzle",
  55:"Drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",
  73:"Snow",75:"Heavy snow",77:"Snow",80:"Showers",81:"Showers",82:"Storms",85:"Snow showers",86:"Snow",
  95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
async function loadWeather(){
  const w=CONFIG.weather;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}`
      +`&current=temperature_2m,weather_code&temperature_unit=${w.unit}&timezone=${encodeURIComponent(CONFIG.timeZone)}`;
    const r=await fetch(u); const d=await r.json();
    const t=Math.round(d.current.temperature_2m); const code=d.current.weather_code;
    document.getElementById("weather").innerHTML=
      `<div class="w-main"><span class="w-ico">${WICON[code]||"🌡️"}</span><span class="w-temp">${t}°</span></div>`
      +`<div class="w-sub">${(WTEXT[code]?WTEXT[code]+" · ":"")}${w.city}</div>`;
  }catch(e){ document.getElementById("weather").innerHTML=`<div class="w-sub">${w.city}</div>`; }
}
loadWeather(); setInterval(loadWeather,15*60*1000);

/* ================== aquarium — ONE-CANVAS composite engine (v1.13.0, 2026-11-27) ==================
   PERF REWRITE: the WHOLE scene — painted background, god-rays, caustics, kelp, fish, coral, anemone,
   bubble-columns, bubbles and the readability scrim — is drawn on ONE <canvas id="life"> at LIFE_RES
   each frame, in z-order; only the clock/weather/app UI stays DOM on top. This removes the old cost of
   the weak TV GPU compositing a STACK of big full-screen DOM layers every frame (fill-rate bound), AND
   drops the background + caustics to the same reduced render resolution as the fish. On top of that,
   fewer creatures are on screen at once (longer off-screen waits). Creatures keep the v4 art + banking
   turns. Config here; scene draw-helpers + loop below. Plants/anemone/bubble-cols now draw on the canvas. */
const LIFE={
  // v4 "believable reef" (2026-11-27): whole cast re-rendered — supersampled then downsampled
  // to delivery for crisp detail — with genuine banking TURN sheets. Specs straight from
  // animation_manifest_v4.json. Per creature: fw/fh = frame; anchorY = body anchor (keeps the
  // axis steady across swim<->turn); swim{} + tn{} each = atlas {file, n frames, fps, cols}
  // (row-major, rows = ceil(n/cols)). s tuned to hold ~the v1.11 on-screen sizes the owner liked.
  // band=[min,max] vertical zone (frac of height); spd=px/s @1920w; turn=chance a crossing
  // U-turns mid-tank (shows the banking art, keeps the fish in view); count=spawn N (shoal);
  // flat=minimal bob; dim=extra fog; rare=long off-screen gaps.
  // MEMORY: resident cast ~56MB decoded (swim+turn for all, +jelly pulse; hero idles skipped —
  // the engine has no in-view hover). If the TV runs low (reloads/flashes), drop a species line.
  // Retired here: school (-> real reef_schooler shoal), yellow_small, shark_silhouette, jelly_small.
  fish:[
    {k:"clownfish",     fw:264,fh:168, anchorY:.481, s:1.09, band:[.12,.40], spd:68, turn:.50,
      swim:{f:"v4_clownfish_swim.png",     n:24,fps:16,cols:4}, tn:{f:"v4_clownfish_turn.png",     n:12,fps:10,cols:3}},
    {k:"bluetang",      fw:264,fh:168, anchorY:.520, s:.95,  band:[.30,.52], spd:60, turn:.50,
      swim:{f:"v4_bluetang_swim.png",      n:22,fps:14,cols:2}, tn:{f:"v4_bluetang_turn.png",      n:12,fps:10,cols:3}},
    {k:"angelfish",     fw:256,fh:232, anchorY:.495, s:1.18, band:[.42,.62], spd:48, turn:.45,
      swim:{f:"v4_angelfish_swim.png",     n:20,fps:8, cols:4}, tn:{f:"v4_angelfish_turn.png",     n:12,fps:10,cols:3}},
    {k:"turtle",        fw:352,fh:236, anchorY:.375, s:.89,  band:[.50,.70], spd:38, turn:.35,
      swim:{f:"v4_turtle_swim.png",        n:20,fps:6, cols:4}, tn:{f:"v4_turtle_turn.png",        n:12,fps:10,cols:3}},
    {k:"reef_schooler", fw:104,fh:72,  anchorY:.468, s:.85,  band:[.18,.42], spd:78, turn:.50, count:2,
      swim:{f:"v4_reef_schooler_swim.png", n:18,fps:15,cols:3}, tn:{f:"v4_reef_schooler_turn.png", n:12,fps:12,cols:3}},
    {k:"crab",          fw:144,fh:96,  anchorY:.374, s:.69,  band:[.885,.915], spd:22, turn:.40, flat:true,
      swim:{f:"v4_crab_swim.png",          n:12,fps:8, cols:3}, tn:{f:"v4_crab_turn.png",          n:14,fps:12,cols:2}},
    {k:"reef_shark",    fw:384,fh:160, anchorY:.536, s:.93,  band:[.40,.62], spd:46, turn:.25, dim:.6, rare:true,
      swim:{f:"v4_reef_shark_swim.png",    n:16,fps:6, cols:2}, tn:{f:"v4_reef_shark_turn.png",    n:12,fps:10,cols:2}},
    {k:"eagle_ray",     fw:320,fh:200, anchorY:.446, s:1.19, band:[.28,.52], spd:40, turn:.30, rare:true,
      swim:{f:"v4_eagle_ray_swim.png",     n:18,fps:6, cols:3}, tn:{f:"v4_eagle_ray_turn.png",     n:12,fps:10,cols:3}},
  ],
  // ONE jelly on screen at a time (owner request); it roams the mid-tank instead of parking in a corner
  jelly:[
    {f:"v4_jellyfish_pulse.png", fw:192,fh:272, n:16,fps:6, cols:4, anchorY:.297, s:1.06},
  ],
  bubbleImg:"bubble.png",
};
const KELP=[
  {f:"kelp_1.png", left:"1.5vw", h:30, bottom:3, sway:"sway1", dur:7.5, delay:-1},
  {f:"kelp_2.png", left:"7vw",   h:35, bottom:2, sway:"sway2", dur:9,   delay:-4},
  {f:"kelp_4.png", left:"88vw",  h:33, bottom:3, sway:"sway3", dur:8,   delay:-2},
  {f:"kelp_3.png", left:"94vw",  h:29, bottom:2, sway:"sway1", dur:6.8, delay:-5},
];
const CORAL=[
  {f:"coral_1.png", side:"left",  pos:"-1vw", h:17},
  {f:"coral_3.png", side:"right", pos:"-1vw", h:18},
  {f:"coral_2.png", side:"left",  pos:"64vw", h:12},
];
const ANEM={f:"anemone_atlas.png", fw:360, fh:300, n:12, fps:6, cols:6, rows:2, s:.5, leftvw:26, bottomvh:1};
const BUBBLECOL=[
  {f:"bubble_column_strip.png", fw:96, fh:256, n:16, fps:6, leftvw:11, bottomvh:1, s:.95},
  {f:"bubble_column_strip.png", fw:96, fh:256, n:16, fps:6, leftvw:85, bottomvh:1, s:.7},
];

/* ---- one-canvas engine: image cache + sizing ---- */
const _imgs={};
function gimg(src){ let im=_imgs[src]; if(!im){ im=new Image(); im.src=src; _imgs[src]=im; } return im; }
const cv=document.getElementById("life"), cx=cv.getContext("2d");
let CW=0, CH=0, CS=1;
const LIFE_RES=0.60;  // v1.13.1: dropped 0.70->0.60 (owner: still laggy). ONE dial scales the WHOLE scene (bg+caustics+plants+fish). Biggest perf dial — go toward 0.52 if still janky (a softer painted background is the trade).
function sizeLife(){ const w=window.innerWidth||1920, h=window.innerHeight||1080; CW=cv.width=Math.round(w*LIFE_RES); CH=cv.height=Math.round(h*LIFE_RES); CS=CW/1920; buildScene(); }
window.addEventListener("resize",sizeLife);
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---- scene art, all drawn on the one canvas back-to-front ---- */
const SCENE={ bg:"reef_background.png", rays:"godrays_overlay.png", caust:"caustics_tile.png" };
function preloadScene(){ [SCENE.bg,SCENE.rays,SCENE.caust,ANEM.f,LIFE.bubbleImg]
  .concat(KELP.map(k=>k.f)).concat(CORAL.map(c=>c.f)).concat(BUBBLECOL.map(b=>b.f)).forEach(gimg); }
// size-dependent caches (rebuilt by sizeLife): a scaled caustics tile->pattern + the scrim gradients
let _caustPat=null, _caustTile=1, _scrimLin=null, _scrimRad=null;
function buildScene(){
  const im=gimg(SCENE.caust);
  if(im.complete&&im.naturalWidth){               // old webviews can't scale a CanvasPattern -> bake a scaled tile canvas
    _caustTile=Math.max(2,Math.round(820*CS));
    const tc=document.createElement("canvas"); tc.width=_caustTile; tc.height=_caustTile;
    tc.getContext("2d").drawImage(im,0,0,_caustTile,_caustTile);
    _caustPat=cx.createPattern(tc,"repeat");
  }
  _scrimLin=cx.createLinearGradient(0,0,0,CH);
  _scrimLin.addColorStop(0,"rgba(2,20,36,.30)"); _scrimLin.addColorStop(.24,"rgba(2,20,36,0)"); _scrimLin.addColorStop(1,"rgba(0,14,26,.32)");
  _scrimRad=cx.createRadialGradient(CW*.5,CH*.40,Math.min(CW,CH)*.30, CW*.5,CH*.40,Math.max(CW,CH)*.72);
  _scrimRad.addColorStop(0,"rgba(0,0,0,0)"); _scrimRad.addColorStop(1,"rgba(2,18,34,.24)");
}
function drawBg(){ const im=gimg(SCENE.bg);
  if(im.complete&&im.naturalWidth){ const ir=im.naturalWidth/im.naturalHeight, cr=CW/CH; let w,h;
    if(ir>cr){ h=CH; w=CH*ir; } else { w=CW; h=CW/ir; } cx.drawImage(im,(CW-w)/2,(CH-h)/2,w,h); }
  else { cx.fillStyle="#072f49"; cx.fillRect(0,0,CW,CH); } }
function drawRays(t){ const im=gimg(SCENE.rays); if(!im.complete||!im.naturalWidth) return;
  const w=CW*1.3334, pan=150*CS*Math.sin(t*2*Math.PI/92);
  cx.save(); cx.globalAlpha=.11; cx.drawImage(im,(CW-w)/2+pan,0,w,CH); cx.restore(); }
function drawCaustics(t){ if(!_caustPat) return;
  const topY=CH*.62, h=CH-topY, bands=6, panX=-(t*7*CS)%_caustTile, panY=-(t*5*CS)%_caustTile;
  cx.save(); cx.fillStyle=_caustPat; cx.translate(panX,panY);
  for(let i=0;i<bands;i++){ const f=(i+1)/bands; cx.globalAlpha=.34*f*f;   // fade in from the top (no hard edge)
    cx.fillRect(-panX, topY+h*(i/bands)-panY, CW, h/bands+1); }
  cx.restore(); }
function drawKelp(t){ for(const k of KELP){ const im=gimg(k.f); if(!im.complete||!im.naturalWidth) continue;
  const hpx=k.h/100*CH, wpx=im.naturalWidth*(hpx/im.naturalHeight), px=parseFloat(k.left)/100*CW+wpx/2, by=CH-k.bottom/100*CH;
  const amp=(k.sway==="sway2"?2.1:k.sway==="sway3"?2:1.9)*Math.PI/180, ang=amp*Math.sin(t*2*Math.PI/k.dur+(k.delay||0));
  cx.save(); cx.translate(px,by); cx.rotate(ang); cx.drawImage(im,-wpx/2,-hpx,wpx,hpx); cx.restore(); } }
function drawCoral(){ for(const c of CORAL){ const im=gimg(c.f); if(!im.complete||!im.naturalWidth) continue;
  const hpx=c.h/100*CH, wpx=im.naturalWidth*(hpx/im.naturalHeight), p=parseFloat(c.pos)/100*CW;
  cx.drawImage(im, c.side==="left"?p:CW-p-wpx, CH-hpx, wpx, hpx); } }
function drawAnemone(t){ const im=gimg(ANEM.f); if(!im.complete||!im.naturalWidth) return;
  const fi=Math.floor(t*ANEM.fps)%ANEM.n, sx=(fi%ANEM.cols)*ANEM.fw, sy=((fi/ANEM.cols)|0)*ANEM.fh;
  const dw=ANEM.fw*ANEM.s*CS, dh=ANEM.fh*ANEM.s*CS, px=ANEM.leftvw/100*CW, by=CH-ANEM.bottomvh/100*CH;
  cx.drawImage(im, sx,sy,ANEM.fw,ANEM.fh, px-dw/2, by-dh, dw,dh); }
function drawBubbleCols(t){ for(const bc of BUBBLECOL){ const im=gimg(bc.f); if(!im.complete||!im.naturalWidth) continue;
  const fi=Math.floor(t*bc.fps)%bc.n, dw=bc.fw*bc.s*CS, dh=bc.fh*bc.s*CS, px=bc.leftvw/100*CW, by=CH-bc.bottomvh/100*CH;
  cx.save(); cx.globalAlpha=.8; cx.drawImage(im, fi*bc.fw,0,bc.fw,bc.fh, px-dw/2, by-dh, dw,dh); cx.restore(); } }
function drawScrim(){ if(_scrimRad){ cx.fillStyle=_scrimRad; cx.fillRect(0,0,CW,CH); } if(_scrimLin){ cx.fillStyle=_scrimLin; cx.fillRect(0,0,CW,CH); } }

function Fish(sp){ this.sp=sp; this.im=gimg(sp.swim.f); this.imT=sp.tn?gimg(sp.tn.f):null;
  const now=performance.now()/1000; this.respawn(now);
  if(Math.random()<.12){ this.x=rnd(.10,.90)*CW; this.turned=true; } // begin mid-tank (no turn this crossing)
  else { this.state="wait"; this.waitUntil=now+rnd(6,90); } }        // begin off-screen, trickle in slowly
Fish.prototype.sc=function(){ return this.sp.s*(.5+.55*this.depth)*CS; };   // live scale (CS may change on resize)
Fish.prototype.respawn=function(t){ const sp=this.sp;
  this.depth0=rnd(.3,1); this.depth=this.depth0; this.dir=(Math.random()<.5?1:-1);
  // per-individual colour variation so repeats of a species never look identical ("clipart")
  this.hue=rnd(-16,16); this.bri=+(.9+rnd(0,.2)).toFixed(3); this.sat=+(.86+rnd(0,.28)).toFixed(3);
  const b=sp.band||[.3,.7]; this.band=b; this.baseY=rnd(b[0],b[1])*CH;
  this.ampY=(sp.flat?rnd(.002,.007):rnd(.015,.04))*CH; this.freqY=rnd(.15,.35); this.phaseY=rnd(0,6.28);
  // motion individuality: per-fish speed, a surge/glide pulse, slow vertical drift, slow depth drift (nearer/farther)
  this.spdMul=rnd(.80,1.18); this.pulseF=rnd(1.4,2.4); this.pulseP=rnd(0,6.28);
  this.vDrift=(sp.flat?0:rnd(-6,6))*CS; this.ddF=rnd(.05,.12); this.ddP=rnd(0,6.28);
  const hw=sp.fw*this.sc()*.5; this.x=(this.dir>0)?-hw-20:CW+hw+20; this.y=this.baseY;
  this.t0=t; this.state="swim";
  // banking U-turn: does THIS crossing reverse mid-tank (once) to show the turn art & linger?
  this.turned=false; this.willTurn=!!sp.tn && Math.random()<(sp.turn||0); this.turnAtX=rnd(.34,.66)*CW; };
Fish.prototype.enterTurn=function(t){ this.state="turn"; this.turnT0=t; this.turned=true;
  this.turnDur=this.sp.tn.n/this.sp.tn.fps; };
Fish.prototype.step=function(t,dt){
  if(this.state==="wait"){ if(t>=this.waitUntil) this.respawn(t); return; }
  // slow depth drift -> live scale / haze / speed breathe (nearer & farther mid-path)
  this.depth=Math.max(.25,Math.min(1,this.depth0+.07*Math.sin(t*this.ddF+this.ddP)));
  if(this.state==="turn"){
    // bank in place: coast to near-stop through the reversal, keep a gentle vertical bob
    const p=Math.min(1,(t-this.turnT0)/this.turnDur);
    this.x+=this.sp.spd*this.spdMul*(1-p)*.35*(.5+.6*this.depth)*CS*this.dir*dt;
    this.y=this.baseY+this.ampY*Math.sin(t*this.freqY+this.phaseY);
    if(p>=1){ this.dir=-this.dir; this.state="swim"; this.t0=t; }   // resume mirrored swim0 the other way
    return;
  }
  // surge/glide: speed pulses with the tail beat, times this fish's own pace
  const surge=1+.15*Math.sin(t*this.pulseF+this.pulseP);
  this.x+=this.sp.spd*this.spdMul*surge*(.5+.6*this.depth)*CS*this.dir*dt;
  // gentle vertical drift so paths angle instead of running dead flat (clamped to the band)
  this.baseY=Math.max(this.band[0]*CH,Math.min(this.band[1]*CH,this.baseY+this.vDrift*dt));
  this.y=this.baseY+this.ampY*Math.sin(t*this.freqY+this.phaseY);
  // mid-tank U-turn when the fish crosses its turn point (needs the turn sheet decoded; else just cross)
  if(this.willTurn&&!this.turned&&this.imT&&this.imT.complete&&this.imT.naturalWidth&&
     ((this.dir>0&&this.x>=this.turnAtX)||(this.dir<0&&this.x<=this.turnAtX))){ this.enterTurn(t); return; }
  const hw=this.sp.fw*this.sc()*.6;
  if((this.dir>0&&this.x>CW+hw)||(this.dir<0&&this.x<-hw)){
    this.state="wait"; this.waitUntil=t+rnd(this.sp.rare?110:50, this.sp.rare?220:120); } };  // long off-screen gaps => ~2-3 fish on screen at once (fish cross slowly, so they linger)
Fish.prototype.draw=function(t){ if(this.state==="wait") return;
  const sp=this.sp; let im,N,fps,cols,fi;
  if(this.state==="turn"){ im=this.imT; N=sp.tn.n; fps=sp.tn.fps; cols=sp.tn.cols;
    fi=Math.min(N-1,Math.floor((t-this.turnT0)*fps)); }        // turn: play once 0..N-1 (right->left profile)
  else { im=this.im; N=sp.swim.n; fps=sp.swim.fps; cols=sp.swim.cols; fi=Math.floor((t-this.t0)*fps)%N; }
  if(!im||!im.complete||!im.naturalWidth) return;
  const sx=(fi%cols)*sp.fw, sy=((fi/cols)|0)*sp.fh;
  const scale=this.sc(), alpha=(.55+.45*this.depth)*(sp.dim||1);
  const vy=this.ampY*this.freqY*Math.cos(t*this.freqY+this.phaseY), tilt=Math.atan2(vy,80)*.5*this.dir;
  cx.save(); cx.globalAlpha=alpha;
  // depth haze: far creatures lose saturation + dim a touch (atmospheric perspective) so they sit INSIDE the water, not on top
  const hz=.60+.40*this.depth, dz=.86+.14*this.depth;
  cx.filter="hue-rotate("+this.hue+"deg) brightness("+(this.bri*dz).toFixed(3)+") saturate("+(this.sat*hz).toFixed(3)+")";
  cx.translate(this.x,this.y);
  if(this.state!=="turn") cx.rotate(tilt);                     // swim: slight pitch; turn: the art does the banking
  // during a turn, mirror by the PRE-turn heading (dir): heading-right plays the sheet as drawn
  // (banks right->left); heading-left plays it mirrored (banks left->right). dir flips when the turn ends.
  cx.scale(this.dir*scale, scale);
  const oy=-(sp.anchorY!=null?sp.anchorY:.5)*sp.fh;           // honour the body anchor (steady axis across sheets)
  // inset the source rect by 0.5px so bilinear sampling can't bleed the neighbouring atlas cell
  cx.drawImage(im, sx+0.5,sy+0.5, sp.fw-1,sp.fh-1, -sp.fw/2,oy, sp.fw,sp.fh); cx.restore(); };

function Jelly(sp,i){ this.sp=sp; this.im=gimg(sp.f); this.depth=rnd(.55,.95);
  this.oxf=.5; this.oyf=rnd(.24,.34); this.axf=rnd(.20,.30); this.ayf=rnd(.08,.16);   // roams the mid-tank (sweeps ~left/right)
  this.fx=rnd(.03,.06); this.fy=rnd(.04,.07); this.px=rnd(0,6.28); this.py=rnd(0,6.28);
  this.t0=performance.now()/1000-rnd(0,10); this.x=this.oxf*CW; this.y=this.oyf*CH; }
Jelly.prototype.step=function(t,dt){ this.x=(this.oxf+this.axf*Math.sin(t*this.fx+this.px))*CW; this.y=(this.oyf+this.ayf*Math.sin(t*this.fy+this.py))*CH; };
Jelly.prototype.draw=function(t){ const sp=this.sp, im=this.im; if(!im.complete||!im.naturalWidth) return;
  const fi=Math.floor((t-this.t0)*sp.fps)%sp.n, scale=sp.s*(.6+.5*this.depth)*CS, alpha=.6+.4*this.depth;
  const cols=sp.cols||1, sx=(fi%cols)*sp.fw, sy=((fi/cols)|0)*sp.fh, oy=-(sp.anchorY!=null?sp.anchorY:.5)*sp.fh;
  cx.save(); cx.globalAlpha=alpha;
  if(sp.tint) cx.filter="hue-rotate("+sp.tint+"deg) saturate(1.1) brightness(1.03)";  // cool-tinted small alias
  cx.translate(this.x,this.y); cx.scale(scale,scale);
  cx.drawImage(im, sx+0.5,sy+0.5, sp.fw-1,sp.fh-1, -sp.fw/2,oy, sp.fw,sp.fh); cx.restore(); };

function Bubble(init){ this.reset(init); }
Bubble.prototype.reset=function(init){ this.x=rnd(.05,.95)*CW; this.y=init?rnd(0,CH):CH+rnd(0,.08*CH);
  this.r=rnd(5,15)*CS; this.vy=rnd(38,88)*CS; this.wob=rnd(8,22)*CS; this.fq=rnd(.5,1.4); this.ph=rnd(0,6.28); this.depth=rnd(.3,1); };
Bubble.prototype.step=function(t,dt){ this.y-=this.vy*dt; this.x+=Math.sin(t*this.fq+this.ph)*this.wob*dt; if(this.y<-20) this.reset(false); };
Bubble.prototype.draw=function(t){ const im=gimg(LIFE.bubbleImg), a=Math.max(0,Math.min(1,this.y/CH))*.6;
  cx.save(); cx.globalAlpha=a;
  if(im.complete&&im.naturalWidth) cx.drawImage(im, this.x-this.r, this.y-this.r, this.r*2, this.r*2);
  else { cx.beginPath(); cx.arc(this.x,this.y,this.r,0,6.283); cx.strokeStyle="rgba(200,240,255,.5)"; cx.lineWidth=1; cx.stroke(); }
  cx.restore(); };

let _fish=[], _jelly=[], _bub=[], _last=0, _acc=0;
function lifeLoop(ms){ requestAnimationFrame(lifeLoop);
  const t=ms/1000; let dt=t-(_last||t); _last=t; if(dt>.08) dt=.08;
  _acc+=dt; if(_acc<1/30) return; const d=_acc; _acc=0;             // ~30fps cap
  for(const f of _fish) f.step(t,d); for(const j of _jelly) j.step(t,d); for(const b of _bub) b.step(t,d);
  // ===== composite the ENTIRE scene on one canvas, back to front (no DOM layers to blend) =====
  drawBg(); drawRays(t); drawCaustics(t); drawKelp(t);             // bg -> god-rays -> caustics -> back plants
  const ds=[]; for(const f of _fish){ if(f.state!=="wait") ds.push(f); } for(const j of _jelly) ds.push(j);
  ds.sort((a,b)=>a.depth-b.depth);                                 // creatures, far first
  for(const o of ds) o.draw(t);
  for(const b of _bub) b.draw(t);                                  // rising bubbles (mid)
  drawCoral(); drawAnemone(t); drawBubbleCols(t);                  // foreground plants
  drawScrim();                                                     // readability darkening (under the DOM UI)
}
function buildLife(){ preloadScene(); sizeLife();                  // sizeLife() runs buildScene() once images start loading
  const ci=gimg(SCENE.caust); if(ci.addEventListener) ci.addEventListener("load",buildScene);  // rebuild the caustics pattern once its tile decodes
  LIFE.fish.forEach(sp=>{ const c=sp.count||1; for(let i=0;i<c;i++) _fish.push(new Fish(sp)); });  // count>1 => loose shoal
  LIFE.jelly.forEach((sp,i)=>_jelly.push(new Jelly(sp,i)));
  for(let i=0;i<6;i++) _bub.push(new Bubble(true));
  requestAnimationFrame(lifeLoop); }
buildLife();

/* ================== launcher / remote nav ================== */
const SERVICE="http://127.0.0.1:8099";
const HAS_TIZEN=typeof window.tizen!=="undefined" && !!window.tizen.application;
function toast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);}
function launchViaService(appId,label,triesLeft=6){
  fetch(SERVICE+"/api/launch",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({id:appId})})
  .then(r=>r.json()).then(d=>{ if(d&&d.ok) toast("Opening "+label+"…");
    else toast("Couldn't launch "+label+(d&&d.error?" ("+d.error+")":"")); })
  .catch(()=>{ if(triesLeft>0) setTimeout(()=>launchViaService(appId,label,triesLeft-1),400);
    else toast(label+": launcher service not reachable (works on the TV)"); });
}
function launchNative(appId,label){
  if(HAS_TIZEN){ try{ window.tizen.application.launch(appId,()=>toast("Opening "+label+"…"),
    e=>toast("Couldn't launch "+label+" ("+e.name+")")); }catch(err){ toast("Launch error: "+err.message); } return; }
  launchViaService(appId,label);
}
function goHome(){
  if(HAS_TIZEN){ try{ window.tizen.application.getCurrentApplication().exit(); return; }catch(err){} }
  toast("Returning to TV home…");
  fetch(SERVICE+"/api/home",{method:"POST",headers:{"Content-Type":"text/plain"},body:"{}"})
    .catch(()=>toast("Home: launcher service not reachable (works on the TV)"));
}

const portEl=document.getElementById("portholes");
const navEl=document.getElementById("nav");
let rows=[], cur={r:0,c:0};
function activateEl(el){
  const ty=el.dataset.type;
  if(ty==="app") launchNative(el.dataset.app, el.dataset.label);
  else if(ty==="home") goHome();
  else if(ty==="tizenbrew") launchNative(CONFIG.tizenbrewApp,"TizenBrew");
}
function build(){
  portEl.innerHTML="";
  CONFIG.tiles.forEach(t=>{
    const el=document.createElement("div");
    el.className="port"+(t.installed===false?" unavailable":""); el.tabIndex=0;
    el.dataset.type="app"; el.dataset.app=t.app; el.dataset.label=t.label;
    if(t.accent) el.style.setProperty("--accent",t.accent);
    const ic=t.icon?`<img class="iconimg" src="${t.icon}" alt="">`:`<div class="emoji">${t.emoji}</div>`;
    el.innerHTML=`<div class="glass">${ic}</div><div class="label">${t.label}</div>`;
    el.addEventListener("click",()=>{ focusEl(el); activateEl(el); });
    portEl.appendChild(el);
  });
  navEl.innerHTML="";
  CONFIG.nav.forEach(n=>{
    const el=document.createElement("div"); el.className="navbtn"; el.tabIndex=0; el.dataset.type=n.action;
    const ic=n.icon?`<img class="naviconimg" src="${n.icon}" alt="">`:`<span class="emoji">${n.emoji}</span>`;
    el.innerHTML=`${ic}<span class="label">${n.label}</span>`;
    el.addEventListener("click",()=>{ focusEl(el); activateEl(el); });
    navEl.appendChild(el);
  });
  rows=[ [...portEl.children], [...navEl.children] ];
  cur={r:0,c:0}; focusCur();
}
function allEls(){ return rows.reduce((a,r)=>a.concat(r),[]); }
function focusCur(){
  allEls().forEach(e=>e.classList.remove("focused"));
  const row=rows[cur.r]; if(!row) return; if(cur.c>=row.length) cur.c=row.length-1;
  const el=row[cur.c]; if(el){ el.classList.add("focused"); el.focus(); }
}
function focusEl(el){ rows.forEach((r,ri)=>{ const ci=r.indexOf(el); if(ci!==-1) cur={r:ri,c:ci}; }); focusCur(); }
function move(dir){
  const row=rows[cur.r]; if(!row) return;
  if(dir==="left")  cur.c=(cur.c-1+row.length)%row.length;
  if(dir==="right") cur.c=(cur.c+1)%row.length;
  if(dir==="up")    cur.r=Math.max(0,cur.r-1);
  if(dir==="down")  cur.r=Math.min(rows.length-1,cur.r+1);
  focusCur();
}
document.addEventListener("keydown",e=>{
  switch(e.keyCode){
    case 37: move("left"); e.preventDefault(); break;
    case 39: move("right"); e.preventDefault(); break;
    case 38: move("up"); e.preventDefault(); break;
    case 40: move("down"); e.preventDefault(); break;
    case 13: { const el=rows[cur.r]&&rows[cur.r][cur.c]; if(el) activateEl(el); e.preventDefault(); break; }
    case 10009: e.preventDefault(); break;
  }
});
build();

/* ================== ambient music loop ================== */
(function(){
  const bgm=document.getElementById("bgm");
  if(!bgm) return;
  bgm.volume=0.45;
  const start=()=>{ const p=bgm.play(); if(p&&p.catch) p.catch(()=>{}); };
  start(); // best-effort autoplay on load (TV may block until a gesture)
  const kick=()=>{ start();
    window.removeEventListener("keydown",kick,true);
    window.removeEventListener("click",kick,true); };
  window.addEventListener("keydown",kick,true);
  window.addEventListener("click",kick,true);
})();
</script>
